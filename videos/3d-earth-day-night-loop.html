<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Animated 3D Earth - 12s Cycle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
    #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    
    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #fff; font-size: 20px; letter-spacing: 2px; z-index: 10; pointer-events: none;
      transition: opacity 0.5s ease;
    }
    
    #ui-hint {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.4); font-size: 14px; z-index: 10; pointer-events: none;
      text-align: center; line-height: 1.5;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Load Three.js dari CDN (Tanpa OrbitControls) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // --- 1. SETUP SCENE, CAMERA, RENDERER ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    // Kamera dikunci statis
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 15);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // --- 2. BIKIN LATAR BELAKANG BINTANG ---
    const starGeometry = new THREE.BufferGeometry();
    const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.05 });
    const starVertices = [];
    for(let i = 0; i < 5000; i++) {
      const x = (Math.random() - 0.5) * 200;
      const y = (Math.random() - 0.5) * 200;
      const z = -Math.random() * 200; 
      starVertices.push(x, y, z);
    }
    starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
    const stars = new THREE.Points(starGeometry, starMaterial);
    scene.add(stars);

    // --- 3. CUSTOM SHADER UNTUK BUMI (SIANG & MALAM) ---
    const earthVertexShader = `
      varying vec2 vUv;
      varying vec3 vNormal;
      void main() {
        vUv = uv;
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const earthFragmentShader = `
      uniform sampler2D dayTexture;
      uniform sampler2D nightTexture;
      uniform vec3 sunDirection; 
      
      varying vec2 vUv;
      varying vec3 vNormal;

      void main() {
        vec3 day = texture2D(dayTexture, vUv).rgb;
        vec3 night = texture2D(nightTexture, vUv).rgb;
        vec3 normal = normalize(vNormal);

        float lightIntensity = dot(normal, sunDirection);
        float mixFactor = smoothstep(-0.2, 0.2, lightIntensity);

        vec3 nightLights = night * vec3(1.0, 0.9, 0.7) * 1.5;
        vec3 daylight = day * max(lightIntensity, 0.0) * 1.5;
        vec3 finalColor = mix(nightLights, daylight, mixFactor);

        float rim = 1.0 - max(dot(normal, vec3(0.0, 0.0, 1.0)), 0.0);
        rim = smoothstep(0.6, 1.0, rim);
        finalColor += vec3(0.2, 0.5, 1.0) * rim * mixFactor * 0.6; 

        gl_FragColor = vec4(finalColor, 1.0);
      }
    `;

    // --- 4. LOAD TEKSTUR & BENTUK BUMI ---
    const textureLoader = new THREE.TextureLoader();
    const radius = 5;
    const segments = 64; 

    const dayTexUrl = "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg";
    const nightTexUrl = "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_lights_2048.png";
    const cloudTexUrl = "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_clouds_1024.png";

    const earthUniforms = {
      dayTexture: { value: null },
      nightTexture: { value: null },
      sunDirection: { value: new THREE.Vector3(1, 0, 0) } 
    };

    const earthMaterial = new THREE.ShaderMaterial({
      vertexShader: earthVertexShader,
      fragmentShader: earthFragmentShader,
      uniforms: earthUniforms
    });

    const earthGeometry = new THREE.SphereGeometry(radius, segments, segments);
    const earthMesh = new THREE.Mesh(earthGeometry, earthMaterial);
    earthMesh.rotation.z = 23.5 * Math.PI / 180;
    scene.add(earthMesh);

    // --- 5. BIKIN LAYER AWAN (CLOUDS) ---
    const cloudGeometry = new THREE.SphereGeometry(radius + 0.05, segments, segments);
    const cloudMaterial = new THREE.MeshLambertMaterial({
      map: null,
      transparent: true,
      opacity: 0.8,
      blending: THREE.AdditiveBlending,
      side: THREE.FrontSide,
      depthWrite: false
    });
    const cloudMesh = new THREE.Mesh(cloudGeometry, cloudMaterial);
    earthMesh.add(cloudMesh); 

    Promise.all([
      textureLoader.loadAsync(dayTexUrl),
      textureLoader.loadAsync(nightTexUrl),
      textureLoader.loadAsync(cloudTexUrl)
    ]).then(([dayTex, nightTex, cloudTex]) => {
      earthUniforms.dayTexture.value = dayTex;
      earthUniforms.nightTexture.value = nightTex;
      cloudMaterial.map = cloudTex;
      cloudMaterial.needsUpdate = true;
      document.getElementById('loading').style.opacity = '0';
    });

    // --- 6. PENCAHAYAAN (Matahari Statis di Kanan) ---
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
    sunLight.position.set(10, 0, 0); // Matahari diam di sebelah kanan
    scene.add(sunLight);
    
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.05); 
    scene.add(ambientLight);

    // --- 7. RESIZE LISTENER ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 8. ANIMASI OTOMATIS BUMI ---
    const sunWorldDirection = new THREE.Vector3(1, 0, 0).normalize();

    function animate() {
      requestAnimationFrame(animate);

      // WAKTU ANIMASI: Bumi muter 360 derajat dalam 12 detik
      const time = Date.now() * 0.001; 
      const cycleDuration = 12.0; 
      const angle = (time % cycleDuration) / cycleDuration * Math.PI * 2;

      // Terapkan rotasi ke bumi
      earthMesh.rotation.y = angle; 
      // Awan dibikin muter sedikit lebih cepat biar ada efek gerak di atmosfer
      cloudMesh.rotation.y = angle * 1.05; 

      // Update arah shader matahari (tetap di kanan)
      const sunViewDirection = sunWorldDirection.clone().transformDirection(camera.matrixWorldInverse).normalize();
      earthUniforms.sunDirection.value.copy(sunViewDirection);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
