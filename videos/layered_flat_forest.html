<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layered Flat Design: Forest Parallax</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0A1118;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, sans-serif;
        }

        /* 16:9 Canvas Scale Wrapper */
        #stage {
            width: 100vw;
            height: 100vh;
            max-width: 177.78vh; /* 16/9 Ratio Limit */
            max-height: 56.25vw;
            background-color: #D0E5E0;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }
        
        /* Hardware acceleration for transform layers */
        g {
            will-change: transform;
        }
    </style>
</head>
<body>

<div id="stage">
    <svg id="forest-svg" viewBox="0 0 1920 1080"></svg>
</div>

<script>
    const svg = document.getElementById('forest-svg');

    // ==========================================
    // 1. ENGINE & UTILITIES
    // ==========================================
    const DURATION = 5.0; // 5-Second Loop

    function clamp(val, min = 0, max = 1) { return Math.max(min, Math.min(max, val)); }
    function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
    
    // Seeded random for consistent SVG generation
    let seed = 987;
    function random() {
        let x = Math.sin(seed++) * 10000;
        return x - Math.floor(x);
    }

    // ==========================================
    // 2. SVG LAYER GENERATOR
    // ==========================================
    let svgStr = "";

    // Helper: Draw Flat Mountain with Shadow Side
    function drawMountain(peakX, peakY, width, cLight, cDark) {
        let baseL = peakX - width;
        let baseR = peakX + width;
        let mtn = `<polygon points="${peakX},${peakY} ${baseL},1080 ${peakX},1080" fill="${cLight}" />`;
        mtn += `<polygon points="${peakX},${peakY} ${peakX},1080 ${baseR},1080" fill="${cDark}" />`;
        return mtn;
    }

    // Helper: Draw Flat Pine Tree with Shadow Side
    function drawPine(cx, bottomY, scale, cLight, cDark, tiers = 3) {
        let tree = `<rect x="${cx - 4 * scale}" y="${bottomY - 15 * scale}" width="${8 * scale}" height="${15 * scale}" fill="#261A15" />`;
        for (let i = 0; i < tiers; i++) {
            let ty = bottomY - 10 * scale - i * 22 * scale;
            let tw = 35 * scale - i * 6 * scale;
            let th = 35 * scale;
            
            // Left (Light)
            tree += `<polygon points="${cx},${ty - th} ${cx},${ty} ${cx - tw},${ty + 5*scale}" fill="${cLight}" />`;
            // Right (Dark)
            tree += `<polygon points="${cx},${ty - th} ${cx},${ty} ${cx + tw},${ty + 5*scale}" fill="${cDark}" />`;
        }
        return tree;
    }

    // Helper: Draw Clouds
    function drawCloud(cx, cy, scale, color) {
        return `
            <g transform="translate(${cx}, ${cy}) scale(${scale})" fill="${color}">
                <circle cx="-30" cy="10" r="30" />
                <circle cx="0" cy="-10" r="45" />
                <circle cx="40" cy="0" r="35" />
                <rect x="-40" y="10" width="80" height="30" rx="15" />
            </g>
        `;
    }

    // --- Z0: SKY & Z1: SUN ---
    svgStr += `<g id="layer-z0"><rect width="1920" height="1080" fill="#D0E5E0" /></g>`;
    svgStr += `<g id="layer-z1" transform-origin="960 540">
        <circle cx="960" cy="450" r="140" fill="#FFE0AA" id="sun-core" />
        <circle cx="960" cy="450" r="180" fill="#FFE0AA" opacity="0.2" id="sun-glow" />
    </g>`;

    // --- Z2: CLOUDS ---
    svgStr += `<g id="layer-z2" transform-origin="960 540">`;
    // Background Clouds (Slower)
    svgStr += `<g id="clouds-bg">`;
    svgStr += drawCloud(300, 200, 0.7, '#E5EFEA');
    svgStr += drawCloud(1500, 280, 0.6, '#E5EFEA');
    svgStr += `</g>`;
    // Foreground Clouds (Faster)
    svgStr += `<g id="clouds-fg">`;
    svgStr += drawCloud(700, 180, 1.1, '#F2F9F8');
    svgStr += drawCloud(1200, 120, 0.9, '#F2F9F8');
    svgStr += `</g></g>`;

    // --- Z3: DISTANT MOUNTAINS ---
    svgStr += `<g id="layer-z3" transform-origin="960 1080">`;
    svgStr += drawMountain(300, 500, 400, '#B4D3D1', '#9DBFBD');
    svgStr += drawMountain(1600, 480, 450, '#B4D3D1', '#9DBFBD');
    svgStr += drawMountain(960, 400, 600, '#A7CAC8', '#8EB4B2'); // Center distant peak
    svgStr += `</g>`;

    // --- Z4: MID MOUNTAINS ---
    svgStr += `<g id="layer-z4" transform-origin="960 1080">`;
    svgStr += drawMountain(150, 650, 450, '#81AFA8', '#6D9C96');
    svgStr += drawMountain(1450, 580, 550, '#81AFA8', '#6D9C96');
    svgStr += drawMountain(750, 600, 500, '#7AA6A0', '#638F8A');
    svgStr += `</g>`;

    // --- Z5: BACKGROUND FOREST (Base Layer at Foothills) ---
    svgStr += `<g id="layer-z5" transform-origin="960 1080">`;
    svgStr += `<rect x="0" y="750" width="1920" height="330" fill="#4E857C" />`;
    // Tiny background tree silhouettes along the ridge
    let bgTrees = "";
    for(let i = 0; i < 60; i++) {
        let tx = i * 35 + (random() * 20 - 10);
        let ts = 0.5 + random() * 0.3;
        bgTrees += drawPine(tx, 760 + random()*10, ts, '#4E857C', '#3D6E66', 2);
    }
    svgStr += bgTrees;
    // Tiny distant cabin and waterfall
    svgStr += `<rect x="1020" y="735" width="20" height="15" fill="#261A15" />`; // Cabin
    svgStr += `<polygon points="1030,725 1015,735 1045,735" fill="#3D2921" />`;
    svgStr += `<path d="M 850 650 L 860 750" stroke="#B5E3E0" stroke-width="4" fill="none" opacity="0.6"/>`; // Waterfall
    svgStr += `</g>`;

    // --- Z6: MIDGROUND TREES & LAND ---
    svgStr += `<g id="layer-z6" transform-origin="960 1080">`;
    svgStr += `<rect x="0" y="820" width="1920" height="260" fill="#2A6158" />`;
    // Left Bank Trees
    for(let i = 0; i < 8; i++) {
        svgStr += drawPine(100 + i*90 + random()*20, 840 + random()*30, 1.2 + random()*0.4, '#2A6158', '#1F4D45', 4);
    }
    // Right Bank Trees
    for(let i = 0; i < 8; i++) {
        svgStr += drawPine(1200 + i*90 + random()*20, 840 + random()*30, 1.2 + random()*0.4, '#2A6158', '#1F4D45', 4);
    }
    svgStr += `</g>`;

    // --- Z7: RIVER ---
    svgStr += `<g id="layer-z7" transform-origin="960 1080">`;
    // Main River Body (Curves out from the center valley to the foreground)
    svgStr += `<path d="M 940 750 C 850 820, 750 900, 300 1080 L 1600 1080 C 1200 900, 1050 820, 980 750 Z" fill="#91CBC8" />`;
    // River Highlights (Visual Movement)
    svgStr += `<path d="M 950 750 C 870 820, 820 900, 500 1080 L 650 1080 C 900 900, 930 820, 970 750 Z" fill="#AEE1E1" opacity="0.6" />`;
    svgStr += `<path d="M 965 750 C 920 820, 950 900, 1100 1080 L 1200 1080 C 1000 900, 970 820, 975 750 Z" fill="#B5E3E0" opacity="0.4" />`;
    // Rocks in river
    svgStr += `<ellipse cx="800" cy="950" rx="25" ry="10" fill="#6D9C96" />`;
    svgStr += `<ellipse cx="1050" cy="980" rx="35" ry="12" fill="#52827F" />`;
    svgStr += `</g>`;

    // --- Z8: FOREGROUND HERO TREES ---
    // Massive detailed silhouettes acting as parallax frames
    svgStr += `<g id="layer-z8" transform-origin="960 1080">`;
    
    // Left Group
    svgStr += `<g id="fg-tree-left">`;
    svgStr += drawPine(180, 1120, 4.5, '#133D38', '#0A2622', 6);
    svgStr += drawPine(30, 1080, 3.5, '#1A453F', '#0C2E29', 5);
    svgStr += `</g>`;
    
    // Right Group
    svgStr += `<g id="fg-tree-right">`;
    svgStr += drawPine(1780, 1150, 5.0, '#133D38', '#0A2622', 6);
    svgStr += drawPine(1600, 1080, 3.0, '#1A453F', '#0C2E29', 5);
    svgStr += `</g>`;
    
    // Birds in the foreground
    svgStr += `<g id="fg-birds" fill="none" stroke="#261A15" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 800 350 Q 810 340 820 350 Q 830 340 840 350" />
        <path d="M 850 320 Q 860 310 870 320 Q 880 310 890 320" transform="scale(0.8) translate(250, 50)" />
    </g>`;
    svgStr += `</g>`;

    // Inject SVG
    svg.innerHTML = svgStr;

    // ==========================================
    // 3. PARALLAX RENDER ENGINE
    // ==========================================
    const layerZ1 = document.getElementById('layer-z1');
    const cloudBg = document.getElementById('clouds-bg');
    const cloudFg = document.getElementById('clouds-fg');
    const layerZ3 = document.getElementById('layer-z3');
    const layerZ4 = document.getElementById('layer-z4');
    const layerZ5 = document.getElementById('layer-z5');
    const layerZ6 = document.getElementById('layer-z6');
    const layerZ7 = document.getElementById('layer-z7');
    const fgLeft = document.getElementById('fg-tree-left');
    const fgRight = document.getElementById('fg-tree-right');
    const sunGlow = document.getElementById('sun-glow');
    const birds = document.getElementById('fg-birds');

    let startTime = null;

    function render(timestamp) {
        if (!startTime) startTime = timestamp;
        let t = ((timestamp - startTime) / 1000) % DURATION;

        // Choreography Timeline
        // 0.0 - 0.7: Hold
        // 0.7 - 3.5: Move in
        // 3.5 - 4.2: Settle / Hold
        // 4.2 - 5.0: Seamless wrap reset
        let p = 0;
        if (t > 0.7 && t <= 3.5) {
            let moveT = clamp((t - 0.7) / 2.8);
            p = easeInOutCubic(moveT);
        } else if (t > 3.5 && t <= 4.2) {
            p = 1;
        } else if (t > 4.2) {
            let resetT = clamp((t - 4.2) / 0.8);
            p = 1 - easeInOutCubic(resetT);
        }

        // --- APPLY PARALLAX TRANSFORMS ---
        
        // Z1: Sun Pulse
        let pulse = Math.sin(t * Math.PI) * 0.2;
        sunGlow.style.opacity = 0.2 + pulse;

        // Z2: Cloud Drift
        cloudBg.style.transform = `translateX(${t * 8}px)`;
        cloudFg.style.transform = `translateX(${t * 18}px)`;

        // Z3: Distant Mountains (Very Slow)
        layerZ3.style.transform = `scale(${1 + 0.04 * p}) translateY(${4 * p}px)`;

        // Z4: Mid Mountains (Slow)
        layerZ4.style.transform = `scale(${1 + 0.08 * p}) translateY(${10 * p}px)`;

        // Z5: Background Forest (Medium Slow)
        layerZ5.style.transform = `scale(${1 + 0.12 * p}) translateY(${18 * p}px)`;

        // Z6: Midground Trees (Medium Fast)
        layerZ6.style.transform = `scale(${1 + 0.18 * p}) translateY(${30 * p}px)`;

        // Z7: River (Fast depth scale, anchoring from bottom)
        layerZ7.style.transform = `scale(${1 + 0.24 * p}) translateY(${45 * p}px)`;

        // Z8: Foreground Trees (Extreme Parallax + Panning Outwards)
        let fgScale = 1 + 0.35 * p;
        let fgY = 70 * p;
        // Pushing trees out of the camera view
        fgLeft.style.transform = `scale(${fgScale}) translate(${-180 * p}px, ${fgY}px)`;
        fgRight.style.transform = `scale(${fgScale}) translate(${180 * p}px, ${fgY}px)`;
        
        // Birds slight fly up
        birds.style.transform = `translate(${p * -40}px, ${p * -60}px) scale(${1 + p * 0.1})`;

        requestAnimationFrame(render);
    }

    // Start Engine
    requestAnimationFrame(render);
</script>
</body>
</html>
