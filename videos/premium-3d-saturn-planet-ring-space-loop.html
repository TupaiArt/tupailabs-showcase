<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Premium 3D Saturn Planet</title>
<style>
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
  }
  body {
    background-color: #05070C;
    overflow: hidden;
  }
  #render-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 3840px;
    height: 2160px;
    overflow: hidden;
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="render-container"></div>

<script type="module">
  import * as THREE from 'three';

  // --- CORE SETUP (3840x2160, 4K Fixed) ---
  const container = document.getElementById('render-container');
  const WIDTH = 3840;
  const HEIGHT = 2160;
  
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05070C);
  
  const renderer = new THREE.WebGLRenderer({ 
    antialias: true,
    alpha: false,
    powerPreference: "high-performance"
  });
  renderer.setSize(WIDTH, HEIGHT);
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  // --- CAMERA CALCULATION ---
  // To match exactly: Planet H = 48%, Ring Outer = 78%, Ring Inner = 53%
  // We use a base scale where Frustum Height at Z=0 is exactly 100 units.
  const FOV = 35;
  const frustumHeight = 100;
  const cameraDistance = (frustumHeight / 2) / Math.tan((FOV / 2) * (Math.PI / 180));
  
  const camera = new THREE.PerspectiveCamera(FOV, WIDTH / HEIGHT, 1, 1000);
  camera.position.set(0, 0, cameraDistance); // ~158.5 units
  camera.lookAt(0, 0, 0);

  // --- PROCEDURAL TEXTURES (Timecut Safe) ---
  
  // 1. Planet Atmospheric Bands Texture
  const planetCanvas = document.createElement('canvas');
  planetCanvas.width = 1024; 
  planetCanvas.height = 512;
  const pCtx = planetCanvas.getContext('2d');
  
  const pGrad = pCtx.createLinearGradient(0, 0, 0, 512);
  pGrad.addColorStop(0.00, '#66513B'); // Dark polar region
  pGrad.addColorStop(0.15, '#C9A878'); // Base
  pGrad.addColorStop(0.35, '#E7D1A7'); // Highlight band
  pGrad.addColorStop(0.45, '#C9A878');
  pGrad.addColorStop(0.50, '#E7D1A7'); // Brighter equator
  pGrad.addColorStop(0.60, '#C9A878');
  pGrad.addColorStop(0.75, '#E7D1A7'); // Secondary highlight
  pGrad.addColorStop(0.85, '#C9A878');
  pGrad.addColorStop(1.00, '#66513B'); // Dark polar region
  pCtx.fillStyle = pGrad;
  pCtx.fillRect(0, 0, 1024, 512);
  
  // Subtle atmospheric noise bands
  for(let i = 0; i < 80; i++) {
    pCtx.fillStyle = `rgba(102, 81, 59, ${Math.random() * 0.15})`;
    pCtx.fillRect(0, Math.random() * 512, 1024, Math.random() * 6);
  }
  
  const planetTexture = new THREE.CanvasTexture(planetCanvas);
  planetTexture.wrapS = THREE.RepeatWrapping;
  planetTexture.wrapT = THREE.RepeatWrapping;

  // 2. Ring Radial Texture
  const ringCanvas = document.createElement('canvas');
  ringCanvas.width = 512; 
  ringCanvas.height = 2;
  const rCtx = ringCanvas.getContext('2d');
  
  const rGrad = rCtx.createLinearGradient(0, 0, 512, 0);
  rGrad.addColorStop(0.00, 'rgba(102, 88, 68, 0.0)'); // Transparent inner fade
  rGrad.addColorStop(0.05, 'rgba(185, 162, 125, 0.9)'); // Inner ring #B9A27D
  rGrad.addColorStop(0.20, 'rgba(227, 209, 168, 1.0)'); // Primary bright #E3D1A8
  rGrad.addColorStop(0.40, 'rgba(185, 162, 125, 0.8)');
  rGrad.addColorStop(0.50, 'rgba(0, 0, 0, 0.0)'); // Narrow gap (Cassini)
  rGrad.addColorStop(0.55, 'rgba(227, 209, 168, 0.9)'); // Outer ring segment
  rGrad.addColorStop(0.80, 'rgba(185, 162, 125, 0.6)');
  rGrad.addColorStop(0.95, 'rgba(102, 88, 68, 0.2)'); // Shadow edge
  rGrad.addColorStop(1.00, 'rgba(0, 0, 0, 0.0)'); // Translucent outer edge
  
  rCtx.fillStyle = rGrad;
  rCtx.fillRect(0, 0, 512, 2);
  const ringTexture = new THREE.CanvasTexture(ringCanvas);

  // --- GEOMETRY & MATERIALS ---
  const masterGroup = new THREE.Group();
  scene.add(masterGroup);

  // 1. Saturn Hero
  // H: 48% viewport = 48 units diameter -> 24 radius
  const planetRadius = 24;
  const planetGeo = new THREE.SphereGeometry(planetRadius, 128, 64);
  const planetMat = new THREE.MeshStandardMaterial({ 
    map: planetTexture,
    color: 0xffffff,
    roughness: 0.6,
    metalness: 0.1
  });
  const saturn = new THREE.Mesh(planetGeo, planetMat);
  saturn.castShadow = true;
  saturn.receiveShadow = true;
  
  // Position 51% viewport (1% below center -> Y: -1 unit)
  saturn.position.y = -1;
  masterGroup.add(saturn);

  // 2. Rings Support
  // Inner: 53% -> 53 diam -> 26.5 radius. Outer: 78% -> 78 diam -> 39 radius.
  const innerRadius = 26.5;
  const outerRadius = 39.0;
  const ringGeo = new THREE.RingGeometry(innerRadius, outerRadius, 256);
  
  // Custom UV mapping for 1D radial texture stretching
  const posAttribute = ringGeo.attributes.position;
  const v3 = new THREE.Vector3();
  for (let i = 0; i < posAttribute.count; i++) {
    v3.fromBufferAttribute(posAttribute, i);
    const radius = v3.length();
    const uvX = (radius - innerRadius) / (outerRadius - innerRadius);
    ringGeo.attributes.uv.setXY(i, uvX, 0.5);
  }

  const ringMat = new THREE.MeshStandardMaterial({
    map: ringTexture,
    color: 0xffffff,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 1.0,
    roughness: 0.7,
    metalness: 0.1,
    alphaTest: 0.05
  });
  
  const ringGroup = new THREE.Group();
  const ringMesh = new THREE.Mesh(ringGeo, ringMat);
  ringMesh.rotation.x = Math.PI / 2; // Lay flat
  ringMesh.castShadow = true;
  ringMesh.receiveShadow = true;
  
  // Ring Axis Tilted ~27 deg against camera plane
  ringGroup.rotation.x = 27 * (Math.PI / 180);
  
  // Position 53% viewport (3% below center -> Y: -3 units)
  ringGroup.position.y = -3;
  
  ringGroup.add(ringMesh);
  masterGroup.add(ringGroup);

  // 3. Subtle Starfield (Background Environment)
  const starsGeo = new THREE.BufferGeometry();
  const starsCount = 800;
  const posArray = new Float32Array(starsCount * 3);
  for(let i = 0; i < starsCount * 3; i++) {
    posArray[i] = (Math.random() - 0.5) * 400; // Spread wide
  }
  starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
  const starsMat = new THREE.PointsMaterial({
    color: 0xFFFFFF,
    size: 0.3,
    transparent: true,
    opacity: 0.4
  });
  const starsMesh = new THREE.Points(starsGeo, starsMat);
  scene.add(starsMesh);

  // --- LIGHTING ---
  const ambientLight = new THREE.AmbientLight(0x1a2235, 0.4); // Deep black-blue ambient
  scene.add(ambientLight);

  // Key Light Upper-Left (X: -35%, Y: 25%, Z: 40% mapping approx)
  const keyLight = new THREE.DirectionalLight(0xfff5e6, 2.2); 
  keyLight.position.set(-60, 40, 50); 
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.width = 2048;
  keyLight.shadow.mapSize.height = 2048;
  keyLight.shadow.camera.near = 10;
  keyLight.shadow.camera.far = 200;
  keyLight.shadow.camera.left = -50;
  keyLight.shadow.camera.right = 50;
  keyLight.shadow.camera.top = 50;
  keyLight.shadow.camera.bottom = -50;
  keyLight.shadow.bias = -0.001;
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0x405070, 0.3); // Subtle blue fill
  fillLight.position.set(50, -20, 20);
  scene.add(fillLight);

  // --- ANIMATION / CHOREOGRAPHY ---
  const DURATION_MS = 8000; 
  let startTime = null;

  function animate(currentTime) {
    if (!startTime) startTime = currentTime;
    
    // Time normalizer (0.0 to 1.0)
    const elapsed = currentTime - startTime;
    const t = (elapsed % DURATION_MS) / DURATION_MS;
    const TWO_PI = Math.PI * 2;
    
    // 1. Orbital Rotation (Continuous, Layered Speed)
    // Planet rotates exactly twice per loop, Ring exactly once per loop to guarantee Frame[0] === Frame[8]
    saturn.rotation.y = TWO_PI * 2 * t;
    ringMesh.rotation.z = -TWO_PI * t; // Z because ring is laid flat on X

    // 2. Signature Motion & Physicality Easing
    // Using a Sine wave mapping to hit peaks gracefully without snapping.
    // Math.sin(t * PI) starts at 0, peaks at 1 (mid-loop), returns to 0.
    const easePhase = Math.sin(t * Math.PI); 
    
    // Scale Choreography: 100% -> 102% -> 100%
    const currentScale = 1.0 + (easePhase * 0.02);
    masterGroup.scale.set(currentScale, currentScale, currentScale);

    // Group Rotation Y: 0 deg -> 18 deg -> 0 deg
    const maxRotation = 18 * (Math.PI / 180);
    masterGroup.rotation.y = easePhase * maxRotation;

    // 3. Micro-Motion
    // Atmospheric Band Offset (±0.8%, Cycle 8s)
    planetTexture.offset.y = Math.sin(t * TWO_PI) * 0.008;

    // Subtle Highlight / Key Light Shift (±2% position)
    keyLight.position.x = -60 + (Math.sin(t * TWO_PI) * 1.5);
    keyLight.position.y = 40 + (Math.cos(t * TWO_PI) * 1.5);

    // Micro-parallax Stars (max 0.2%)
    starsMesh.rotation.y = Math.sin(t * TWO_PI) * 0.002;
    starsMesh.rotation.z = Math.cos(t * TWO_PI) * 0.001;

    // Render Frame
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }

  // Auto-start (No user interaction required)
  requestAnimationFrame(animate);
</script>
</body>
</html>
