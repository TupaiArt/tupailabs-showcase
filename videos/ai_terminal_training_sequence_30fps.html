<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  *, *::before, *::after { 
    box-sizing: border-box; 
  }
  body, html { 
    margin: 0; 
    padding: 0; 
    width: 3840px; 
    height: 2160px; 
    background: transparent; 
    overflow: hidden; 
    font-family: Consolas, 'Courier New', Courier, monospace; 
  }
  
  #canvas { 
    position: absolute; 
    width: 3840px; 
    height: 2160px; 
    left: 0; 
    top: 0; 
  }
  
  .window { 
    position: absolute; 
    width: 2800px; 
    height: 1600px; 
    left: 520px; 
    top: 280px; 
    background: #111827; 
    border: 4px solid #374151; 
    border-radius: 40px; 
    overflow: hidden; 
  }
  
  .top-bar { 
    position: absolute; 
    width: 2800px; 
    height: 120px; 
    left: 0; 
    top: 0; 
    background: #1F2937; 
    border-bottom: 4px solid #374151; 
  }
  
  .dot { 
    position: absolute; 
    width: 40px; 
    height: 40px; 
    top: 40px; 
    border-radius: 50%; 
  }
  
  .dot-red { left: 40px; background: #EF4444; }
  .dot-yellow { left: 100px; background: #F59E0B; }
  .dot-green { left: 160px; background: #10B981; }
  
  .title { 
    position: absolute; 
    width: 2800px; 
    top: 35px; 
    left: 0; 
    text-align: center; 
    color: #9CA3AF; 
    font-size: 40px; 
  }
  
  #content-area { 
    position: absolute; 
    top: 120px; 
    left: 0px; 
    width: 2800px; 
    height: 1480px; 
  }
  
  .line { 
    position: absolute; 
    left: 80px; 
    font-size: 52px; 
    white-space: pre; 
    display: none;
  }
</style>
</head>
<body>
  <div id="canvas">
    <div class="window">
      <div class="top-bar">
        <div class="dot dot-red"></div>
        <div class="dot dot-yellow"></div>
        <div class="dot dot-green"></div>
        <div class="title">terminal — bash</div>
      </div>
      <div id="content-area"></div>
    </div>
  </div>

  <script>
    const linesData = [
      { text: "$ init deep_learning_model --v=4.0", color: "#60A5FA", startTime: 500, dur: 1200 },
      { text: "✓ Environment established (0.4s)", color: "#10B981", startTime: 2200, dur: 0 },
      { text: "✓ Neural weights loaded", color: "#10B981", startTime: 2700, dur: 0 },
      { text: "✓ CUDA cores synchronized", color: "#10B981", startTime: 3200, dur: 0 },
      { text: "$ start training_sequence --epochs=5000", color: "#60A5FA", startTime: 4200, dur: 1500 },
      { text: "► Training epoch 1... loss: 0.842 | accuracy: 24%", color: "#FBBF24", startTime: 6200, dur: 500 },
      { text: "► Training epoch 5000... loss: 0.012 | accuracy: 99.8%", color: "#FBBF24", startTime: 7200, dur: 500 },
      { text: "✓ Model training complete. Optimal convergence achieved.", color: "#10B981", startTime: 8200, dur: 0 },
      { text: "$ deploy --production", color: "#60A5FA", startTime: 9000, dur: 800 }
    ];

    const contentArea = document.getElementById("content-area");

    linesData.forEach((line, index) => {
      const el = document.createElement("div");
      el.className = "line";
      el.style.top = (index * 110 + 60) + "px";
      el.style.color = line.color;
      contentArea.appendChild(el);
      line.el = el;
    });

    let startTime = null;
    const fps = 30;
    const frameInterval = 1000 / fps;
    let lastRenderTime = 0;

    function renderFrame(timestamp) {
      if (!startTime) startTime = timestamp;
      
      // Time-based throttle for 30fps deterministic rendering under headless setup
      const t = timestamp - startTime;
      
      linesData.forEach((line, i) => {
        let currentText = "";
        let active = false;

        if (t >= line.startTime) {
          if (line.dur === 0) {
            currentText = line.text;
            if (t >= line.startTime && (i === linesData.length - 1 || t < linesData[i+1].startTime)) {
              active = true;
            }
          } else {
            let progress = Math.min(1, Math.max(0, (t - line.startTime) / line.dur));
            let chars = Math.floor(progress * line.text.length);
            currentText = line.text.substring(0, chars);
            
            if (progress < 1) {
              active = true;
            } else if (i === linesData.length - 1 || t < linesData[i+1].startTime) {
              active = true;
            }
          }
        }

        let cursor = "";
        if (active) {
           if (Math.floor(t / 400) % 2 === 0) {
             cursor = "█";
           }
        }

        if (t >= line.startTime) {
            line.el.innerText = currentText + cursor;
            line.el.style.display = "block";
        } else {
            line.el.style.display = "none";
        }
      });

      requestAnimationFrame(renderFrame);
    }

    requestAnimationFrame(renderFrame);
  </script>
</body>
</html>
