<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bento Grid - Smart Home Control</title>
    <style>
        /* 
         * GLOBAL SETUP
         * Fixed 3840x2160 composition for Motion Studio rendering.
         */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Arial', sans-serif; /* Geometric and clean */
        }

        #canvas {
            width: 3840px;
            height: 2160px;
            background-color: #E9E7E1; /* Outer Background */
            position: relative;
            overflow: hidden;
            transform-origin: center center;
            color: #171717;
        }

        /* 
         * BENTO GRID WRAPPER
         * 3440px x 1880px
         * 4 Columns (830px each) + 3 Gaps (40px)
         * 3 Rows (600px each) + 2 Gaps (40px)
         */
        #bento-wrapper {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 3440px;
            height: 1880px;
            transform: translate(-50%, -50%) scale(0.98);
            will-change: transform;
        }

        /* 
         * BASE CARD STYLES
         */
        .bento-card {
            position: absolute;
            background-color: #F7F6F2;
            border: 6px solid #191919;
            border-radius: 40px;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            will-change: transform, opacity;
            opacity: 0; /* JS controls entrance */
        }

        .dark-card {
            background-color: #171717;
            color: #F7F6F2;
        }

        .card-title {
            font-size: 45px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Grid Positions */
        #card-home { left: 0; top: 0; width: 1700px; height: 1240px; }
        #card-wea  { left: 1740px; top: 0; width: 830px; height: 600px; }
        #card-sec  { left: 2610px; top: 0; width: 830px; height: 600px; }
        #card-liv  { left: 1740px; top: 640px; width: 1700px; height: 600px; }
        #card-lig  { left: 0; top: 1280px; width: 830px; height: 600px; }
        #card-ene  { left: 870px; top: 1280px; width: 830px; height: 600px; }
        #card-aut  { left: 1740px; top: 1280px; width: 1700px; height: 600px; }

        /* 
         * SPECIFIC CARD CONTENTS
         */

        /* HOME */
        .home-top { font-size: 50px; font-weight: 800; color: #B8E04B; }
        .home-temp-wrapper { display: flex; align-items: baseline; gap: 20px; }
        .home-temp { font-size: 380px; font-weight: 900; line-height: 1; letter-spacing: -15px; }
        .home-unit { font-size: 120px; font-weight: 700; }
        .home-status { font-size: 60px; font-weight: 800; border-top: 6px solid #191919; padding-top: 40px; display: flex; justify-content: space-between;}
        #home-house-icon { position: absolute; right: 100px; top: 100px; }

        /* WEATHER */
        .wea-temp { font-size: 160px; font-weight: 900; line-height: 1.1; letter-spacing: -5px; }
        .wea-desc { font-size: 55px; font-weight: 700; }
        .wea-hl { font-size: 40px; font-weight: 600; color: #777; margin-top: 20px; }
        #wea-sun-icon { position: absolute; right: 50px; top: 50px; }

        /* SECURITY */
        .sec-status { font-size: 70px; font-weight: 800; display: flex; align-items: center; gap: 20px; margin-top: 40px;}
        .sec-dot { width: 40px; height: 40px; border-radius: 50%; background-color: #555; }
        .sec-sub { font-size: 40px; font-weight: 600; color: #aaa; margin-top: 20px; }
        #sec-radar { position: absolute; right: -50px; bottom: -50px; }

        /* LIVING ROOM */
        #liv-content { display: flex; height: 100%; align-items: center; justify-content: space-between; position: relative; z-index: 10; }
        .liv-stats { display: flex; gap: 80px; font-size: 55px; font-weight: 800; }
        .liv-stat-val { color: #B8E04B; }
        #liv-floorplan { position: absolute; right: 20px; top: 20px; z-index: 5; opacity: 0.5; }

        /* LIGHTS */
        .lig-main { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
        .lig-text { font-size: 75px; font-weight: 900; }
        .lig-sub { font-size: 45px; font-weight: 700; color: #777; }
        #lig-indicator { position: relative; width: 250px; height: 250px; }
        .circle-bg { fill: none; stroke: #D9D5C8; stroke-width: 30; }
        .circle-fg { fill: none; stroke: #191919; stroke-width: 30; stroke-dasharray: 628; stroke-dashoffset: 628; stroke-linecap: square; transition: stroke 0.3s; }
        .circle-text { font-size: 55px; font-weight: 900; fill: #191919; text-anchor: middle; dominant-baseline: central; }

        /* ENERGY */
        .ene-val { font-size: 130px; font-weight: 900; letter-spacing: -5px; line-height: 1; margin-top: 20px;}
        .ene-sub { font-size: 45px; font-weight: 700; color: #777; margin-bottom: 20px;}
        #ene-graph-box { width: 100%; height: 200px; position: relative; overflow: hidden; border-bottom: 6px solid #191919;}
        #ene-line { fill: none; stroke: #B8E04B; stroke-width: 12; stroke-dasharray: 1000; stroke-dashoffset: 1000; stroke-linejoin: round;}

        /* AUTOMATION */
        .aut-content { display: flex; justify-content: space-between; align-items: flex-end; height: 100%; }
        .aut-title { font-size: 120px; font-weight: 900; letter-spacing: -3px; line-height: 1; }
        .aut-sub { font-size: 45px; font-weight: 700; color: #777; margin-top: 20px;}
        #aut-toggle { width: 220px; height: 100px; border-radius: 50px; border: 6px solid #191919; background-color: #D9D5C8; position: relative; }
        #aut-toggle-circle { position: absolute; width: 76px; height: 76px; border-radius: 50%; background-color: #191919; top: 6px; left: 6px; }

        /* LABEL */
        #brand-label {
            position: absolute;
            bottom: 60px;
            right: 80px;
            font-size: 35px;
            font-weight: 800;
            color: #171717;
            letter-spacing: 3px;
        }

        /* UTILS */
        .op-0 { opacity: 0; }
        svg { overflow: visible; }
    </style>
</head>
<body>

    <div id="canvas">
        
        <div id="bento-wrapper">
            
            <!-- HOME CARD -->
            <div id="card-home" class="bento-card">
                <div>
                    <div class="card-title home-top">GOOD MORNING</div>
                    <div class="card-title" style="font-size: 80px; margin-top: 10px;">HOME</div>
                </div>
                
                <svg id="home-house-icon" width="300" height="300" viewBox="0 0 300 300">
                    <polygon points="150,20 280,130 280,280 20,280 20,130" fill="none" stroke="#191919" stroke-width="20" stroke-linejoin="bevel"/>
                    <rect x="110" y="180" width="80" height="100" fill="#191919"/>
                    <circle cx="150" cy="100" r="25" fill="#B8E04B"/>
                </svg>

                <div>
                    <div class="home-temp-wrapper op-0" id="home-temp-wrap">
                        <div class="home-temp" id="home-val">68</div>
                        <div class="home-unit">°F</div>
                    </div>
                    <div class="home-status op-0" id="home-status-wrap">
                        <div id="home-stat-text">INITIALIZING...</div>
                        <div id="home-dev-text">3 DEVICES ACTIVE</div>
                    </div>
                </div>
            </div>

            <!-- WEATHER CARD -->
            <div id="card-wea" class="bento-card">
                <div class="card-title">WEATHER</div>
                <svg id="wea-sun-icon" width="150" height="150" viewBox="0 0 150 150">
                    <circle cx="75" cy="75" r="40" fill="#B8E04B"/>
                    <path d="M75 10 V 25 M75 125 V 140 M10 75 H 25 M125 75 H 140 M29 29 L 40 40 M110 110 L 121 121 M29 121 L 40 110 M110 40 L 121 29" stroke="#191919" stroke-width="12" stroke-linecap="square"/>
                </svg>
                <div class="op-0" id="wea-info">
                    <div class="wea-temp">24°</div>
                    <div class="wea-desc">CLEAR</div>
                    <div class="wea-hl">H: 27° &nbsp; L: 19°</div>
                </div>
            </div>

            <!-- SECURITY CARD -->
            <div id="card-sec" class="bento-card dark-card">
                <div class="card-title">SECURITY</div>
                
                <svg id="sec-radar" width="400" height="400" viewBox="0 0 400 400">
                    <circle cx="200" cy="200" r="80" fill="none" stroke="#333" stroke-width="4"/>
                    <circle cx="200" cy="200" r="140" fill="none" stroke="#333" stroke-width="4"/>
                    <path id="radar-sweep" d="M200 200 L 200 60 A 140 140 0 0 1 321 130 Z" fill="#B8E04B" opacity="0.15"/>
                    <line x1="200" y1="200" x2="200" y2="60" stroke="#B8E04B" stroke-width="4"/>
                </svg>

                <div class="op-0" id="sec-info">
                    <div class="sec-status">
                        <div class="sec-dot" id="sec-dot"></div>
                        <div id="sec-text">CHECKING</div>
                    </div>
                    <div class="sec-sub">3 CAMERAS ONLINE</div>
                </div>
            </div>

            <!-- LIVING ROOM CARD -->
            <div id="card-liv" class="bento-card">
                <div class="card-title" style="position: absolute; top: 50px; left: 50px;">LIVING ROOM</div>
                
                <svg id="liv-floorplan" width="600" height="500" viewBox="0 0 600 500">
                    <rect x="50" y="50" width="500" height="400" fill="none" stroke="#D9D5C8" stroke-width="15"/>
                    <rect x="100" y="100" width="200" height="150" fill="none" stroke="#D9D5C8" stroke-width="10"/>
                    <rect x="400" y="200" width="100" height="200" fill="none" stroke="#D9D5C8" stroke-width="10"/>
                    <line x1="50" y1="250" x2="150" y2="250" stroke="#D9D5C8" stroke-width="15"/>
                </svg>

                <div id="liv-content" class="op-0">
                    <div style="margin-top: 150px; width: 100%;">
                        <div class="liv-stats">
                            <div>LIGHTS <br><span class="liv-stat-val" id="liv-lig">OFF</span></div>
                            <div>TEMP <br><span class="liv-stat-val" id="liv-tmp">23°</span></div>
                            <div>TV <br><span class="liv-stat-val">OFF</span></div>
                            <div>BLINDS <br><span class="liv-stat-val">45%</span></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- LIGHTS CARD -->
            <div id="card-lig" class="bento-card">
                <div class="card-title">LIGHTS</div>
                <div class="lig-main op-0" id="lig-info">
                    <div>
                        <div class="lig-text" id="lig-state">OFF</div>
                        <div class="lig-sub">LIVING ROOM</div>
                    </div>
                    <div id="lig-indicator">
                        <svg width="250" height="250" viewBox="0 0 250 250">
                            <circle class="circle-bg" cx="125" cy="125" r="100" />
                            <circle class="circle-fg" id="lig-circle" cx="125" cy="125" r="100" transform="rotate(-90 125 125)" />
                            <text class="circle-text" id="lig-percent" x="125" y="125">0%</text>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- ENERGY CARD -->
            <div id="card-ene" class="bento-card">
                <div class="card-title">ENERGY</div>
                <div class="op-0" id="ene-info">
                    <div class="ene-val">3.8 <span style="font-size: 60px;">kWh</span></div>
                    <div class="ene-sub">↓ 12% TODAY</div>
                    <div id="ene-graph-box">
                        <svg width="730" height="200" viewBox="0 0 730 200">
                            <polyline id="ene-line" points="0,180 100,150 200,170 300,100 400,120 500,50 600,80 730,30" />
                        </svg>
                    </div>
                </div>
            </div>

            <!-- AUTOMATION CARD -->
            <div id="card-aut" class="bento-card">
                <div class="card-title">AUTOMATION</div>
                <div class="aut-content op-0" id="aut-info">
                    <div>
                        <div class="aut-title">GOOD NIGHT</div>
                        <div class="aut-sub">4 DEVICES &nbsp; / &nbsp; <span id="aut-state-text">INACTIVE</span></div>
                    </div>
                    <div id="aut-toggle">
                        <div id="aut-toggle-circle"></div>
                    </div>
                </div>
            </div>

        </div>

        <div id="brand-label">TUPAI HOME OS / 08:42</div>

    </div>

    <script>
        /**
         * ANIMATION ENGINE
         */
        const easings = {
            linear: x => x,
            outCubic: x => 1 - Math.pow(1 - x, 3),
            inOutCubic: x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
            outBack: x => { const c1 = 1.70158; const c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
        };

        function evaluateTrack(track, t, defaultValue) {
            if (!track || track.length === 0) return defaultValue;
            if (t <= track[0].t) return track[0].v;
            if (t >= track[track.length - 1].t) return track[track.length - 1].v;

            for (let i = 0; i < track.length - 1; i++) {
                if (t >= track[i].t && t < track[i + 1].t) {
                    const kf1 = track[i];
                    const kf2 = track[i + 1];
                    const progress = (t - kf1.t) / (kf2.t - kf1.t);
                    const eased = easings[kf2.e || 'outCubic'](progress);
                    return kf1.v + (kf2.v - kf1.v) * eased;
                }
            }
            return defaultValue;
        }

        /**
         * CHOREOGRAPHY TRACKS
         */
        const config = [
            
            // --- GRID BUILD (0.0 - 0.8s) ---
            // Staggered entrances
            {
                id: 'card-home',
                tracks: {
                    opacity: [ {t:0.0,v:0}, {t:0.6,v:1,e:'linear'} ],
                    scale: [ {t:0.0,v:0.96}, {t:0.6,v:1,e:'outCubic'} ],
                    y: [ {t:0.0,v:50}, {t:0.6,v:0,e:'outCubic'} ]
                }
            },
            {
                id: 'card-liv',
                tracks: {
                    opacity: [ {t:0.1,v:0}, {t:0.7,v:1,e:'linear'} ],
                    scale: [ {t:0.1,v:0.96}, {t:0.7,v:1,e:'outCubic'} ],
                    y: [ {t:0.1,v:50}, {t:0.7,v:0,e:'outCubic'} ]
                }
            },
            {
                id: 'card-sec',
                tracks: {
                    opacity: [ {t:0.15,v:0}, {t:0.75,v:1,e:'linear'} ],
                    scale: [ {t:0.15,v:0.96}, {t:0.75,v:1,e:'outCubic'} ],
                    y: [ {t:0.15,v:50}, {t:0.75,v:0,e:'outCubic'} ]
                }
            },
            {
                id: 'card-wea',
                tracks: {
                    opacity: [ {t:0.2,v:0}, {t:0.8,v:1,e:'linear'} ],
                    scale: [ {t:0.2,v:0.96}, {t:0.8,v:1,e:'outCubic'} ],
                    y: [ {t:0.2,v:50}, {t:0.8,v:0,e:'outCubic'} ]
                }
            },
            {
                id: 'card-lig',
                tracks: {
                    opacity: [ {t:0.25,v:0}, {t:0.85,v:1,e:'linear'} ],
                    scale: [ {t:0.25,v:0.96}, {t:0.85,v:1,e:'outCubic'} ],
                    y: [ {t:0.25,v:50}, {t:0.85,v:0,e:'outCubic'} ]
                }
            },
            {
                id: 'card-ene',
                tracks: {
                    opacity: [ {t:0.3,v:0}, {t:0.9,v:1,e:'linear'} ],
                    scale: [ {t:0.3,v:0.96}, {t:0.9,v:1,e:'outCubic'} ],
                    y: [ {t:0.3,v:50}, {t:0.9,v:0,e:'outCubic'} ]
                }
            },
            {
                id: 'card-aut',
                tracks: {
                    opacity: [ {t:0.35,v:0}, {t:0.95,v:1,e:'linear'} ],
                    scale: [ {t:0.35,v:0.96}, {t:0.95,v:1,e:'outCubic'} ],
                    y: [ {t:0.35,v:50}, {t:0.95,v:0,e:'outCubic'} ]
                }
            },

            // --- INFO FLOOD (Fade In Info inside cards ~0.8s) ---
            { id: 'home-temp-wrap', tracks: { opacity: [ {t:0.6,v:0}, {t:1.0,v:1} ] } },
            { id: 'home-status-wrap', tracks: { opacity: [ {t:0.7,v:0}, {t:1.1,v:1} ] } },
            { id: 'wea-info', tracks: { opacity: [ {t:0.8,v:0}, {t:1.2,v:1} ] } },
            { id: 'sec-info', tracks: { opacity: [ {t:0.8,v:0}, {t:1.2,v:1} ] } },
            { id: 'liv-content', tracks: { opacity: [ {t:0.9,v:0}, {t:1.3,v:1} ] } },
            { id: 'lig-info', tracks: { opacity: [ {t:0.9,v:0}, {t:1.3,v:1} ] } },
            { id: 'ene-info', tracks: { opacity: [ {t:1.0,v:0}, {t:1.4,v:1} ] } },
            { id: 'aut-info', tracks: { opacity: [ {t:1.0,v:0}, {t:1.4,v:1} ] } },

            // --- ANIMATED ELEMENTS ---
            
            // LIGHTS Progress Circle (Total circumference = 628)
            // 72% of 628 = 452 (Offset starts at 628, goes to 628 - 452 = 176)
            {
                id: 'lig-circle',
                tracks: {
                    strokeDashoffset: [ {t:0,v:628}, {t:1.8,v:628}, {t:2.8,v:176,e:'inOutCubic'} ]
                }
            },

            // ENERGY Graph Draw
            {
                id: 'ene-line',
                tracks: {
                    strokeDashoffset: [ {t:0,v:1000}, {t:2.8,v:1000}, {t:3.8,v:0,e:'outCubic'} ]
                }
            },

            // AUTOMATION Toggle
            {
                id: 'aut-toggle-circle',
                tracks: {
                    x: [ {t:0,v:0}, {t:2.0,v:0}, {t:2.6,v:132,e:'outBack'} ]
                }
            },

            // SECURITY Radar Rotation
            {
                id: 'radar-sweep',
                tracks: {
                    rot: [ {t:0,v:0}, {t:5.0,v:360,e:'linear'} ] // Continuous
                }
            },

            // GLOBAL BENTO WRAPPER SCALE IN (3.8s - 5.0s)
            {
                id: 'bento-wrapper',
                tracks: {
                    scale: [ {t:0,v:0.98}, {t:3.8,v:0.98}, {t:5.0,v:1.0,e:'outCubic'} ]
                }
            }
        ];

        /**
         * RENDER LOOP
         */
        let startTime = null;
        
        function render(timestamp) {
            if (!startTime) startTime = timestamp;
            let t = (timestamp - startTime) / 1000;

            // 1. Evaluate Tracks
            config.forEach(conf => {
                const el = document.getElementById(conf.id);
                if (!el) return;

                if (conf.tracks.x !== undefined || conf.tracks.y !== undefined || conf.tracks.scale !== undefined || conf.tracks.rot !== undefined) {
                    let x = evaluateTrack(conf.tracks.x, t, 0);
                    let y = evaluateTrack(conf.tracks.y, t, 0);
                    let scale = evaluateTrack(conf.tracks.scale, t, 1);
                    let rot = evaluateTrack(conf.tracks.rot, t, 0);
                    
                    if (el.id === 'bento-wrapper') {
                        el.style.transform = `translate(-50%, -50%) scale(${scale})`;
                    } else if (el.id === 'radar-sweep') {
                        el.style.transformOrigin = '200px 200px';
                        el.style.transform = `rotate(${rot}deg)`;
                    } else {
                        el.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
                    }
                }

                if (conf.tracks.opacity !== undefined) {
                    el.style.opacity = evaluateTrack(conf.tracks.opacity, t, 1);
                }

                if (conf.tracks.strokeDashoffset !== undefined) {
                    el.style.strokeDashoffset = evaluateTrack(conf.tracks.strokeDashoffset, t, 0);
                }
            });

            // 2. Logic Triggers (Text / Values)
            
            // HOME Temp Counter (0.8s to 1.8s)
            let tempVal = 68;
            if (t > 0.8 && t <= 1.8) {
                tempVal = Math.floor(68 + ((t - 0.8) / 1.0) * 4); // 68 to 72
            } else if (t > 1.8) {
                tempVal = 72;
            }
            document.getElementById('home-val').innerText = tempVal;

            // HOME Status updates
            if (t > 1.8 && t <= 2.8) {
                document.getElementById('home-stat-text').innerText = "ALL SYSTEMS NORMAL";
                document.getElementById('home-stat-text').style.color = "#171717";
            } else if (t > 2.8) {
                document.getElementById('home-dev-text').innerText = "7 DEVICES ONLINE";
                document.getElementById('home-dev-text').style.color = "#B8E04B";
            }

            // SECURITY State
            if (t > 1.8) {
                document.getElementById('sec-text').innerText = "PROTECTED";
                document.getElementById('sec-dot').style.backgroundColor = "#B8E04B";
            }

            // LIGHTS State
            if (t > 1.8) {
                document.getElementById('lig-state').innerText = "ON";
                document.getElementById('lig-state').style.color = "#B8E04B";
                document.getElementById('lig-circle').style.stroke = "#B8E04B";
                document.getElementById('liv-lig').innerText = "ON";
                
                // Animate percent text matched to the SVG dash animation
                let pct = Math.floor(Math.max(0, Math.min(72, (t - 1.8) / 1.0 * 72)));
                document.getElementById('lig-percent').innerText = pct + "%";
            }

            // LIVING ROOM Temp Shift
            if (t > 2.8) {
                document.getElementById('liv-tmp').innerText = "22°";
            }

            // AUTOMATION State
            if (t > 2.2) { // Middle of the toggle animation
                document.getElementById('aut-state-text').innerText = "ACTIVE";
                document.getElementById('aut-state-text').style.color = "#B8E04B";
                document.getElementById('aut-toggle').style.backgroundColor = "#B8E04B";
            }

            // Loop forever, deterministic maps hold states
            requestAnimationFrame(render);
        }

        // Start Animation
        requestAnimationFrame(render);

    </script>
</body>
</html>
