<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro-Interaction: Dark Mode Toggle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* 16:9 Canvas Container */
        #stage {
            width: 100vw;
            height: 100vh;
            max-width: 177.78vh; /* 16/9 * 100 */
            max-height: 56.25vw;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

<div id="stage">
    <canvas id="toggleCanvas" width="1920" height="1080"></canvas>
</div>

<script>
    const canvas = document.getElementById('toggleCanvas');
    const ctx = canvas.getContext('2d');

    // ==========================================
    // 1. ENGINE & EASING
    // ==========================================
    const DURATION = 5.0; // 5 Detik Seamless Loop
    
    const easings = {
        linear: x => x,
        easeInOutCubic: x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
        easeOutCubic: x => 1 - Math.pow(1 - x, 3),
        easeInCubic: x => x * x * x
    };

    function evaluateTrack(track, t, defaultValue = 0) {
        if (!track || track.length === 0) return defaultValue;
        if (t <= track[0].t) return track[0].v;
        if (t >= track[track.length - 1].t) return track[track.length - 1].v;
        for (let i = 0; i < track.length - 1; i++) {
            if (t >= track[i].t && t < track[i + 1].t) {
                const k1 = track[i], k2 = track[i + 1];
                const p = (t - k1.t) / (k2.t - k1.t);
                const ease = easings[k2.e || 'linear'];
                return k1.v + (k2.v - k1.v) * ease(p);
            }
        }
        return defaultValue;
    }

    // HEX to RGB Interpolation
    function lerpColor(hexA, hexB, t) {
        const r1 = parseInt(hexA.substring(1,3), 16), g1 = parseInt(hexA.substring(3,5), 16), b1 = parseInt(hexA.substring(5,7), 16);
        const r2 = parseInt(hexB.substring(1,3), 16), g2 = parseInt(hexB.substring(3,5), 16), b2 = parseInt(hexB.substring(5,7), 16);
        
        const r = Math.round(r1 + (r2 - r1) * t);
        const g = Math.round(g1 + (g2 - g1) * t);
        const b = Math.round(b1 + (b2 - b1) * t);
        return `rgb(${r}, ${g}, ${b})`;
    }

    function roundedRect(ctx, x, y, width, height, radius) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
    }

    // ==========================================
    // 2. TIMELINE CHOREOGRAPHY
    // ==========================================
    
    const config = {
        // Press State & Rebound
        trackScale: [
            {t: 0.0, v: 1}, {t: 0.8, v: 1}, {t: 0.92, v: 0.98, e: 'easeOutCubic'}, {t: 1.0, v: 1, e: 'easeOutCubic'},
            {t: 2.4, v: 1}, {t: 2.45, v: 0.98, e: 'easeOutCubic'}, {t: 2.5, v: 1, e: 'easeOutCubic'}
        ],
        knobScale: [
            {t: 0.0, v: 1}, {t: 0.8, v: 1}, {t: 0.92, v: 0.94, e: 'easeOutCubic'}, {t: 1.0, v: 1, e: 'easeOutCubic'},
            {t: 2.4, v: 1}, {t: 2.45, v: 0.94, e: 'easeOutCubic'}, {t: 2.5, v: 1, e: 'easeOutCubic'}
        ],
        // Horizontal Movement (Left -> Right -> Left)
        knobX: [
            {t: 0.0, v: -75}, {t: 1.0, v: -75}, 
            {t: 1.45, v: 75, e: 'easeInOutCubic'}, // Travel OFF -> ON (0.45s)
            {t: 2.5, v: 75}, 
            {t: 2.9, v: -75, e: 'easeInOutCubic'}  // Travel ON -> OFF (0.40s - slightly faster)
        ],
        // Velocity compression (Stretch effect during travel)
        knobStretch: [
            {t: 1.0, v: 1}, {t: 1.25, v: 1.04, e: 'easeOutCubic'}, {t: 1.45, v: 1, e: 'easeInCubic'},
            {t: 2.5, v: 1}, {t: 2.7, v: 1.04, e: 'easeOutCubic'}, {t: 2.9, v: 1, e: 'easeInCubic'}
        ],
        // Background Transition (Slightly delayed from knob)
        bgProgress: [
            {t: 1.0, v: 0}, {t: 1.15, v: 0}, {t: 1.7, v: 1, e: 'easeInOutCubic'},
            {t: 2.5, v: 1}, {t: 3.1, v: 0, e: 'easeInOutCubic'}
        ],
        // Color & Morphing Progress (0 = Sun/Light, 1 = Moon/Dark)
        morphProgress: [
            {t: 1.0, v: 0}, {t: 1.4, v: 1, e: 'easeInOutCubic'},
            {t: 2.5, v: 1}, {t: 2.8, v: 0, e: 'easeInOutCubic'}
        ],
        labelOp: [
            {t: 0.0, v: 0}, {t: 1.7, v: 0}, {t: 2.0, v: 1, e: 'easeOutCubic'},
            {t: 2.4, v: 1}, {t: 2.5, v: 0, e: 'easeOutCubic'}
        ],
        labelY: [
            {t: 1.7, v: 15}, {t: 2.0, v: 0, e: 'easeOutCubic'}, {t: 2.4, v: 0}
        ]
    };

    // Stars Data (Fixed aesthetic positions)
    const stars = [
        { x: -160, y: -90, s: 0.6, delay: 0 },
        { x: -90, y: -120, s: 0.4, delay: 0.05 },
        { x: 140, y: -110, s: 0.7, delay: 0.1 },
        { x: 190, y: 50,  s: 0.5, delay: 0.08 },
        { x: -180, y: 70,  s: 0.4, delay: 0.03 },
        { x: 0, y: 130,  s: 0.8, delay: 0.12 }
    ];

    // ==========================================
    // 3. RENDER LOOP
    // ==========================================
    let startTime = null;

    function render(timestamp) {
        if (!startTime) startTime = timestamp;
        let t = ((timestamp - startTime) / 1000) % DURATION;

        // Evaluasi Timeline
        let trackS     = evaluateTrack(config.trackScale, t);
        let knobS      = evaluateTrack(config.knobScale, t);
        let knobX      = evaluateTrack(config.knobX, t);
        let knobStr    = evaluateTrack(config.knobStretch, t);
        let bgP        = evaluateTrack(config.bgProgress, t);
        let morphP     = evaluateTrack(config.morphProgress, t);
        let lblOp      = evaluateTrack(config.labelOp, t);
        let lblY       = evaluateTrack(config.labelY, t);

        // Interpolasi Warna Palette
        let bgColor    = lerpColor("#F4F1E8", "#111827", bgP);
        let trackColor = lerpColor("#D8D5CE", "#20283D", morphP);
        let knobColor  = lerpColor("#FFFFFF", "#F5C95B", morphP);
        let iconColor  = lerpColor("#F5C95B", "#FFFFFF", morphP);

        // Bersihkan Canvas & Render Background
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2); // Pindah koordinat ke tengah

        // Scale global untuk menyesuaikan ukuran (280x130) dengan Canvas 1080p
        ctx.scale(2.5, 2.5); 

        // --- A. DECORATIVE STARS REVEAL ---
        // Stars muncul saat bgProgress bergerak (1.45s -> 1.75s)
        stars.forEach(star => {
            let starT = t;
            let starP = 0;
            
            // Forward (Muncul)
            if (t >= 1.45 + star.delay && t < 2.5) {
                starP = Math.min(1, (t - (1.45 + star.delay)) / 0.3);
                starP = easings.easeOutCubic(starP);
            } 
            // Reverse (Hilang)
            else if (t >= 2.5 && t < 2.9) {
                starP = Math.max(0, 1 - (t - 2.5) / 0.2);
            }

            if (starP > 0) {
                ctx.save();
                ctx.translate(star.x, star.y);
                ctx.scale(starP * star.s, starP * star.s);
                ctx.globalAlpha = starP * 0.8;
                ctx.fillStyle = "#FFFFFF";
                ctx.beginPath();
                ctx.arc(0, 0, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        });

        // --- B. TRACK RENDERING ---
        ctx.save();
        ctx.scale(trackS, trackS);
        ctx.fillStyle = trackColor;
        // 280 x 130, center di 0,0
        roundedRect(ctx, -140, -65, 280, 130, 65);
        ctx.fill();
        ctx.restore();

        // --- C. KNOB RENDERING ---
        ctx.save();
        ctx.translate(knobX, 0);
        ctx.scale(knobS * knobStr, knobS); // Apply press + stretch
        
        ctx.fillStyle = knobColor;
        ctx.beginPath();
        ctx.arc(0, 0, 55, 0, Math.PI * 2);
        ctx.fill();

        // --- D. MORPHING ICON (SUN -> MOON) ---
        ctx.save();
        
        // Parameter Morphing
        let baseRadius = 20 + (8 * morphP); // 20 -> 28
        let rayScale = Math.max(0, 1 - (morphP * 2.5)); // Sinar menyusut dengan cepat
        let shadowOffset = 50 - (38 * morphP); // Secondary circle bergerak masuk untuk membentuk crescent

        // 1. Center Body (Sun Core / Moon Crescent Outer)
        ctx.fillStyle = iconColor;
        ctx.beginPath();
        ctx.arc(0, 0, baseRadius, 0, Math.PI * 2);
        ctx.fill();

        // 2. Sun Rays
        if (rayScale > 0) {
            ctx.strokeStyle = iconColor;
            ctx.lineWidth = 4;
            ctx.lineCap = "round";
            ctx.globalAlpha = rayScale;
            
            for (let i = 0; i < 8; i++) {
                let angle = (i * Math.PI) / 4;
                let r1 = 28;
                let r2 = 28 + (10 * rayScale);
                ctx.beginPath();
                ctx.moveTo(Math.cos(angle) * r1, Math.sin(angle) * r1);
                ctx.lineTo(Math.cos(angle) * r2, Math.sin(angle) * r2);
                ctx.stroke();
            }
            ctx.globalAlpha = 1.0;
        }

        // 3. Moon Cutout (Trick: Draw circle matching knob color to mask the base shape)
        if (morphP > 0) {
            ctx.fillStyle = knobColor; // Masking color
            ctx.beginPath();
            ctx.arc(shadowOffset, -shadowOffset + 5, baseRadius, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore(); // Icon Restore
        ctx.restore(); // Knob Restore

        // --- E. TYPOGRAPHY LABEL (DARK MODE) ---
        if (lblOp > 0) {
            ctx.save();
            ctx.translate(0, 120 + lblY);
            ctx.globalAlpha = lblOp;
            ctx.fillStyle = "#A1A9BC";
            ctx.font = "600 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
            ctx.textAlign = "center";
            ctx.letterSpacing = "4px";
            ctx.fillText("DARK MODE", 0, 0);
            ctx.restore();
        }

        ctx.restore(); // Center Canvas Restore

        requestAnimationFrame(render);
    }

    // Start Engine
    requestAnimationFrame(render);
</script>

</body>
</html>
