<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Tupai Studio - Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero">
        <div class="logo-container">
            <!-- UBAH BAGIAN INI: Ganti nama file logonya -->
            <img src="logo web putih.png" alt="Motion Tupai Studio Logo" class="logo">
        </div>
        <h1>MOTION TUPAI STUDIO</h1>
        <p>Contoh Motion Graphics yang Bisa Kamu Buat</p>
    </header>

    <main class="container">
        <!-- Grid Video -->
        <div id="showcase-grid" class="grid">
            <!-- Video akan di-generate otomatis oleh script.js -->
        </div>

        <!-- Pesan Error -->
        <div id="error-message" class="hidden">
            <p>Showcase data could not be loaded.</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
